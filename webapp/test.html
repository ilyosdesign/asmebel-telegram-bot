<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASMEBEL Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #071320;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      color: #e5c158;
      margin-bottom: 20px;
      text-align: center;
    }
    .section {
      background: rgba(18, 38, 58, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .preview-box {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    svg {
      max-width: 100%;
      height: auto;
    }
    .buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    button {
      flex: 1;
      padding: 12px;
      background: #e5c158;
      color: #000;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    button:hover {
      background: #f3d77b;
      transform: scale(1.05);
    }
    .color-picker {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .color-btn {
      width: 40px;
      height: 40px;
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .color-btn.active {
      border-color: #e5c158;
      box-shadow: 0 0 10px rgba(229, 193, 88, 0.5);
    }
    .info {
      background: rgba(229, 193, 88, 0.1);
      border-left: 3px solid #e5c158;
      padding: 12px;
      border-radius: 4px;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏗️ ASMEBEL - Oshxona Konstruktori TEST</h1>

    <!-- Kitchen Section -->
    <div class="section">
      <h2>Oshxona Shakli</h2>
      <div class="buttons">
        <button onclick="setKitchenShape('straight')">I - To'g'ri</button>
        <button onclick="setKitchenShape('lshape')">L - L-simon</button>
        <button onclick="setKitchenShape('ushape')">U - U-simon</button>
      </div>

      <h3 style="margin-top: 15px; margin-bottom: 10px;">Rang Tanlang</h3>
      <div class="color-picker">
        <div class="color-btn active" style="background: #ffffff;" onclick="setColor('#ffffff', this)"></div>
        <div class="color-btn" style="background: #2c2e33;" onclick="setColor('#2c2e33', this)"></div>
        <div class="color-btn" style="background: #8a5a36;" onclick="setColor('#8a5a36', this)"></div>
        <div class="color-btn" style="background: #3c5063;" onclick="setColor('#3c5063', this)"></div>
      </div>

      <h3 style="margin-top: 15px; margin-bottom: 10px;">3D Ko'rinish</h3>
      <div class="preview-box" id="preview-container">
        <div style="color: #8ea8c3;">Loading...</div>
      </div>

      <div class="info">
        ✅ SVG visualization aktiv. Rang o'zgarganda, model o'zgaradi.
      </div>
    </div>

    <!-- Wardrobe Section -->
    <div class="section">
      <h2>Shkof Konstruktori</h2>
      <div class="buttons">
        <button onclick="setWardrobeType('kupe')">Kupe</button>
        <button onclick="setWardrobeType('swing')">Ochiladigan</button>
        <button onclick="setWardrobeType('gardirob')">Gardirob</button>
      </div>

      <h3 style="margin-top: 15px; margin-bottom: 10px;">Eshiklar soni: <span id="door-count">3</span></h3>
      <input type="range" id="door-slider" min="2" max="6" value="3" style="width: 100%; cursor: pointer;" onchange="updateDoors(this.value)">

      <h3 style="margin-top: 15px; margin-bottom: 10px;">3D Ko'rinish</h3>
      <div class="preview-box" id="wardrobe-preview">
        <div style="color: #8ea8c3;">Loading...</div>
      </div>

      <div class="info">
        ✅ Eshiklar soni o'zgarganda, model yangilanadir.
      </div>
    </div>
  </div>

  <script>
    let currentColor = '#ffffff';
    let currentDoors = 3;
    let wardrobeColor = '#ffffff';

    function setColor(color, btn) {
      currentColor = color;
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderKitchen();
    }

    function setKitchenShape(shape) {
      renderKitchen();
    }

    function setWardrobeType(type) {
      renderWardrobe();
    }

    function updateDoors(count) {
      currentDoors = parseInt(count);
      document.getElementById('door-count').innerText = count;
      renderWardrobe();
    }

    function renderKitchen() {
      const svg = `
        <svg viewBox="0 0 320 180" style="width: 100%; height: auto; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));">
          <rect width="320" height="180" fill="rgba(0,0,0,0.1)" rx="8"/>
          <rect x="20" y="140" width="280" height="30" fill="rgba(100,120,140,0.2)" rx="4"/>
          <rect x="20" y="20" width="280" height="120" fill="rgba(180,200,220,0.08)" rx="4"/>

          <!-- Upper Cabinets -->
          <rect x="30" y="30" width="40" height="35" fill="${currentColor}" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="2"/>
          <rect x="75" y="30" width="40" height="35" fill="${currentColor}" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="2"/>
          <rect x="120" y="30" width="40" height="35" fill="${currentColor}" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="2"/>
          <rect x="165" y="30" width="40" height="35" fill="${currentColor}" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="2"/>
          <rect x="210" y="30" width="60" height="35" fill="${currentColor}" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="2"/>

          <!-- Countertop -->
          <rect x="30" y="68" width="240" height="8" fill="rgba(212,175,55,0.4)" stroke="rgba(212,175,55,0.6)" stroke-width="1" rx="1"/>

          <!-- Lower Cabinets -->
          <rect x="30" y="78" width="50" height="55" fill="${currentColor}" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="2"/>
          <rect x="85" y="78" width="50" height="55" fill="${currentColor}" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="2"/>
          <rect x="140" y="78" width="50" height="55" fill="${currentColor}" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="2"/>
          <rect x="195" y="78" width="75" height="55" fill="${currentColor}" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="2"/>

          <!-- Sink -->
          <ellipse cx="110" cy="120" rx="8" ry="6" fill="rgba(200,200,200,0.3)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
        </svg>
      `;
      document.getElementById('preview-container').innerHTML = svg;
    }

    function renderWardrobe() {
      let doorsHtml = '';
      const doorWidth = (280 / currentDoors);

      for (let i = 0; i < currentDoors; i++) {
        const x = 20 + (i * doorWidth);
        doorsHtml += `
          <rect x="${x}" y="30" width="${doorWidth - 2}" height="140" fill="${wardrobeColor}" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" rx="2"/>
          <circle cx="${x + doorWidth / 2}" cy="100" r="2.5" fill="rgba(212,175,55,0.7)"/>
        `;
      }

      const svg = `
        <svg viewBox="0 0 320 200" style="width: 100%; height: auto; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));">
          <rect width="320" height="200" fill="rgba(0,0,0,0.1)" rx="8"/>
          <rect x="20" y="175" width="280" height="15" fill="rgba(100,120,140,0.2)" rx="2"/>
          <rect x="20" y="20" width="280" height="160" fill="rgba(180,200,220,0.08)" rx="4"/>

          ${doorsHtml}

          <rect x="20" y="20" width="280" height="4" fill="rgba(212,175,55,0.3)" rx="2"/>
        </svg>
      `;
      document.getElementById('wardrobe-preview').innerHTML = svg;
    }

    // Initial render
    window.addEventListener('load', function() {
      renderKitchen();
      renderWardrobe();
      console.log('✅ Test sahifasi yuklandi');
    });
  </script>
</body>
</html>
